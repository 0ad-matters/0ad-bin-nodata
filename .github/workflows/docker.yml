name: Docker AppImage Image CI

on:
  push:
    branches: [ "trunk" ]
    paths:
      - '**/docker.yml'
      - 'Dockerfile**'
  pull_request:
    branches: [ "trunk" ]
    paths:
      - '**/docker.yml'
      - 'Dockerfile**'

env:
  VERSION: 0.27.0
  REGISTRY_IMAGE: andy5995/0ad-bin-nodata

jobs:
  image-with-appimage:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: andy5995
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        if: ${{ github.ref == 'refs/heads/trunk' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.appimage
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.REGISTRY_IMAGE }}:appimage-${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:appimage-${{ env.VERSION }}-buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:appimage-${{ env.VERSION }}-buildcache,mode=max

  bin-no-data:
    needs:
      - image-with-appimage
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: andy5995
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        if: ${{ github.ref == 'refs/heads/trunk' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:${{ env.VERSION }}-buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:${{ env.VERSION }}-buildcache,mode=max
